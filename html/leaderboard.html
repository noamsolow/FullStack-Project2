<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Game Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/leaderboard.css">
</head>
<body class="auth-required">
    <!-- Navbar will be injected by JavaScript -->

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Leaderboard Header -->
            <header class="leaderboard-header">
                <h1>🏆 Leaderboard</h1>
                <p>See who's topping the charts!</p>
            </header>

            <!-- Game Tabs -->
            <div class="game-tabs">
                <button class="tab-btn active" data-game="game1">
                    <span class="tab-icon">🐵</span>
                    <span class="tab-name">Code Runner</span>
                </button>
                <button class="tab-btn" data-game="game2">
                    <span class="tab-icon">🪑</span>
                    <span class="tab-name">Hangman</span>
                </button>
            </div>

            <!-- Leaderboard Content -->
            <div class="leaderboard-container">
                <!-- Top 3 Podium -->
                <div class="podium-section" id="podiumSection">
                    <div class="podium">
                        <!-- 2nd Place -->
                        <div class="podium-place second" id="podium2">
                            <div class="podium-avatar">🥈</div>
                            <div class="podium-name">---</div>
                            <div class="podium-score">0</div>
                            <div class="podium-stand">2</div>
                        </div>
                        <!-- 1st Place -->
                        <div class="podium-place first" id="podium1">
                            <div class="podium-avatar">🥇</div>
                            <div class="podium-name">---</div>
                            <div class="podium-score">0</div>
                            <div class="podium-stand">1</div>
                        </div>
                        <!-- 3rd Place -->
                        <div class="podium-place third" id="podium3">
                            <div class="podium-avatar">🥉</div>
                            <div class="podium-name">---</div>
                            <div class="podium-score">0</div>
                            <div class="podium-stand">3</div>
                        </div>
                    </div>
                </div>

                <!-- Full Leaderboard Table -->
                <div class="leaderboard-table-section">
                    <h2>📊 Full Rankings</h2>
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Player</th>
                                <th>Score</th>
                                <th>Difficulty</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody">
                            <tr>
                                <td colspan="5" class="no-data">No scores yet. Be the first to play!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Your Rank Section -->
                <div class="your-rank-section" id="yourRankSection">
                    <h2>📍 Your Best Score</h2>
                    <div class="your-rank-card">
                        <div class="rank-position" id="yourRank">#--</div>
                        <div class="rank-details">
                            <span class="rank-username" id="yourUsername">---</span>
                            <span class="rank-score" id="yourScore">Score: 0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <!-- Storage: Only leaderboard management needed for rankings display -->
    <script src="../js/utils/storage/leaderboardManagement.js"></script>
    <script src="../js/components/background.js"></script>
    <script src="../js/login/auth.js"></script>
    <script src="../js/components/navbar.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/leaderboard/leaderboard.js"></script>
</body>
</html>
